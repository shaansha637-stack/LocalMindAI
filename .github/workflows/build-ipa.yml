name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          set -eo pipefail
          if [ -f project.yml ]; then
            brew install xcodegen
            xcodegen generate
          fi
          WS=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*.xcodeproj/*" -not -path "*/Pods/*" | head -n 1)
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -n "$WS" ]; then TARGET=(-workspace "$WS")
          elif [ -n "$PROJ" ]; then TARGET=(-project "$PROJ")
          else echo "::error::No .xcodeproj or .xcworkspace found"; exit 1; fi
          echo "Using: ${TARGET[*]}"
          SCHEME=$(xcodebuild -list -json "${TARGET[@]}" | python3 -c "import sys,json; t=sys.stdin.read(); d=json.loads(t[t.index('{'):]); x=d.get('workspace') or d.get('project'); s=[n for n in x['schemes'] if 'Test' not in n] or x['schemes']; print(s[0])")
          echo "Scheme: $SCHEME"
          xcodebuild "${TARGET[@]}" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::No .app was produced"; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa